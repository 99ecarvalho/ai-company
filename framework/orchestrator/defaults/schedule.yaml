# Platform-level scheduler defaults (tracked no framework).
#
# Toda instancia herda esses jobs automaticamente. Pra sobrescrever
# parametros (TTL, retain, cron) — redefina o MESMO `id` em
# `instance/agents/schedule.yaml`, que ganha.
#
# Jobs especificos da empresa (posts agendados, curadoria de backlog,
# etc) vao pro instance schedule.yaml, NAO aqui. Regra:
# "se e igual pra todo mundo que usa o framework, vai aqui".

jobs:
  # ---- Cleanup: live_events completos (TTL longo — 7 dias) ----
  # Limpa tudo: linhas com ts > 7d sao deletadas. Mantem metrica +
  # debug de incidentes recentes sem deixar tabela explodir.
  - id: cleanup-live-events
    cron: "0 2 * * *"            # diario 02:00
    action: cleanup_live_events
    days: 7

  # ---- Cleanup: output_full do data JSONB (TTL curto — 48h) ----
  # Remove so o campo `output_full` dos tool_result apos 48h. A linha
  # fica (inline `output` 5KB preservado), o blob grande sai. "View full"
  # no PWA funciona durante a sessao; depois ve so o inline.
  - id: cleanup-live-events-output-full
    cron: "17 * * * *"           # de hora em hora, offset 17 pra espalhar
    action: cleanup_live_events_output_full
    hours: 48

  # ---- Cleanup: telemetry events (cost/tokens) — retencao longa ----
  - id: cleanup-telemetry
    cron: "30 2 * * *"           # diario 02:30 (offset pra nao colidir)
    action: cleanup_telemetry
    days: 90

  # ---- Cleanup: web.sessions expiradas ----
  - id: cleanup-sessions
    cron: "15 * * * *"           # de hora em hora, offset 15
    action: cleanup_sessions

  # ---- Backup: company/ (tar.gz com agents.yaml + override + notes) ----
  - id: daily-backup-company
    cron: "0 3 * * *"            # diario 03:00
    action: backup_company
    retain: 30

  # ---- Backup: postgres dump gzipped ----
  - id: daily-backup-postgres
    cron: "15 3 * * *"           # diario 03:15 (offset pra nao colidir)
    action: backup_postgres
    retain: 30

  # ---- Cost budget check: alerta quando agente passa limite diario ----
  - id: cost-budget-check
    cron: "*/30 * * * *"         # a cada 30min
    action: cost_budget_check
