# Opt-in GPU overlay for the transcriber.
#
# Enable:
#   echo 'COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml' >> .env
#   docker compose up -d transcriber
#
# Host prerequisites:
#   - NVIDIA Container Toolkit installed (https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/)
#   - `docker info | grep -i nvidia` shows the runtime
#
# Without this overlay the transcriber runs on CPU (faster-whisper int8) —
# slower, but works on any host. Defaults in the main compose file:
# WHISPER_MODEL=small / WHISPER_DEVICE=cpu / WHISPER_COMPUTE_TYPE=int8.
services:
  transcriber:
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cuda}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-float16}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
