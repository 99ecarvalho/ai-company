# ai-company — base stack.
# Messaging lives in Postgres + an HTTP broker in 'web' (no external broker).

name: ai-company

services:

  # --- Postgres: the system's single storage ---
  # Schemas: messaging, orchestrator, memory, telemetry, web.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_company}
      POSTGRES_USER: ${POSTGRES_USER:-ai_company}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - postgres-data:/var/lib/postgresql/data:rw
      # The schema now comes from framework/db/migrations/, applied by the web
      # container's entrypoint before uvicorn starts. See framework/scripts/migrate.py.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_company}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 120s

  # --- Web: broker HTTP (messages, events SSE, subs, users) + PWA ---
  # Port 9090 on the host (configurable via WEB_PORT — useful for several
  # companies on one machine). Also serves the admin / telemetry / memory routes.
  web:
    build:
      context: .
      dockerfile: framework/web/Dockerfile
    image: ai-company/web:0.1.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-9090}:8090"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ai_company}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_company}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ORCHESTRATOR_TOKEN: ${ORCHESTRATOR_TOKEN}
      SCHEDULER_TOKEN: ${SCHEDULER_TOKEN}
      WEB_DEFAULT_STREAM: ${WEB_DEFAULT_STREAM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CONTACT_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      WEB_AUTH_DEV_BYPASS: ${WEB_AUTH_DEV_BYPASS:-}
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-}
      TERMINAL_NOTIFY_STREAM: ${TERMINAL_NOTIFY_STREAM:-}
      TRANSCRIBER_URL: http://transcriber:8000
      TTS_URL: http://tts:8000
      TRANSCRIBER_API_KEY: ${TRANSCRIBER_API_KEY:-}
      TRANSCRIBER_MAX_UPLOAD_MB: ${TRANSCRIBER_MAX_UPLOAD_MB:-50}
      SCHEDULER_URL: http://scheduler:8811
      LOG_LEVEL: INFO
      PROJECT_ROOT_HOST: ${PWD}
      # Host user's HOME — passed through so agent_bootstrap.py can expand
      # ${HOME}/.claude/ when mounting volumes via the SDK (compose normally
      # resolves this var on the host; without the CLI, web does it via env).
      HOST_HOME: ${HOME}
      # COMPOSE_PROJECT_NAME: used by agent_bootstrap to compute
      # container names (`<project>-agent-<slug>-1`). Compose already injects
      # COMPOSE_PROJECT_NAME automatically in some contexts, but passing it
      # explicitly ensures the web container always sees the correct name,
      # even when customized in .env.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-ai-company}
      # Hire/onboard: slug of the agent that hosts the claude CLI used to
      # generate drafts. The container name is derived dynamically from the
      # slug + COMPOSE_PROJECT_NAME (covers instances with a custom project name).
      # HIRE_AGENT_CONTAINER (full override) still works for unusual setups
      # that need to point at a non-standard container.
      HIRE_AGENT: ${HIRE_AGENT:-executor}
      HIRE_AGENT_CONTAINER: ${HIRE_AGENT_CONTAINER:-}
      TZ: ${TZ:-America/Sao_Paulo}
      # PWA — generic framework defaults, overridden by the instance's .env.
      # The manifest is rendered dynamically at /manifest.webmanifest.
      PWA_NAME: ${PWA_NAME:-Agents}
      PWA_SHORT_NAME: ${PWA_SHORT_NAME:-Agents}
      PWA_DESCRIPTION: ${PWA_DESCRIPTION:-Multi-agent orchestration}
      PWA_THEME_COLOR: ${PWA_THEME_COLOR:-#0b1220}
      PWA_BACKGROUND_COLOR: ${PWA_BACKGROUND_COLOR:-#0b1220}
      PWA_ID: ${PWA_ID:-/ai-company}
      PWA_LANG: ${PWA_LANG:-en}
      PWA_START_URL: ${PWA_START_URL:-/}
      PWA_ORIENTATION: ${PWA_ORIENTATION:-any}
      INSTANCE_WEB_DIR: /workspace/web
      HIRE_MODEL: ${HIRE_MODEL:-}
    volumes:
      - ${AGENTS_DIR:-./instance/agents}:/workspace/agents      # rw to "hire" a new agent (reconcile)
      - ${COMPANY_DIR:-./instance/company}:/workspace/company   # rw for the file viewer + upload
      - ${REPOS_DIR:-./instance/repos}:/workspace/repos         # rw: file viewer + /api/repos/init (agents mount it ro, D-115)
      - ${SESSIONS_DIR:-./instance/sessions}:/workspace/sessions  # rw: reconcile mkdirs <name>/ per new agent
      - ${INSTANCE_WEB_DIR:-./instance/web}:/workspace/web:ro   # ro: PWA assets override (icons/)
      # In-process reconcile: .env and override.yml rw to write rotated
      # tokens + generate service defs.
      - ./.env:/workspace/.env                                  # rw: reconcile upsert_env (rotated tokens)
      - ./docker-compose.override.yml:/workspace/docker-compose.override.yml  # rw: reconcile generates service defs
      - /var/run/docker.sock:/var/run/docker.sock               # to create agents via the docker SDK + auto-bootstrap
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- Orchestrator reactor: consumes orchestrator.events + posts handoffs ---
  orchestrator-reactor:
    image: ai-company/agent:0.1.0
    build:
      context: .
      dockerfile: framework/docker/agent.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ai_company}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_company}
      BROKER_URL: http://web:8090
      BROKER_TOKEN: ${ORCHESTRATOR_TOKEN}
      LOG_LEVEL: INFO
      POLL_INTERVAL_SEC: "2"
      TERMINAL_NOTIFY_STREAM: ${TERMINAL_NOTIFY_STREAM:-}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ${COMPANY_DIR:-./instance/company}:/workspace/company:ro
    command: ["python3", "-m", "orchestrator.reactor"]
    working_dir: /app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8810/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- Watchdog: restarts agents with a stale heartbeat ---
  watchdog:
    build:
      context: ./framework/watchdog
      dockerfile: Dockerfile
    image: ai-company/watchdog:0.1.0
    restart: unless-stopped
    environment:
      HEARTBEAT_DIR: /heartbeats
      POLL_INTERVAL_SEC: "60"
      STALE_THRESHOLD_SEC: "180"
      RESTART_COOLDOWN_SEC: "600"
      CONTAINER_PREFIX: "${COMPOSE_PROJECT_NAME:-ai-company}-agent-"
      CONTAINER_SUFFIX: "-1"
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./instance/heartbeats:/heartbeats:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8812/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- Hot reload (DEV ONLY): watches CLAUDE.md/agent.yaml -> docker restart
  # Enable with: docker compose --profile dev up -d hot-reload
  hot-reload:
    image: ai-company/watchdog:0.1.0
    build:
      context: ./framework/watchdog
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: [dev]
    environment:
      AGENTS_DIR: /workspace/agents
      POLL_SEC: "5"
      COOLDOWN_SEC: "10"
      CONTAINER_PREFIX: "${COMPOSE_PROJECT_NAME:-ai-company}-agent-"
      CONTAINER_SUFFIX: "-1"
      WATCH_FILES: "CLAUDE.md,agent.yaml"
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ${AGENTS_DIR:-./instance/agents}:/workspace/agents:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["python3", "-u", "hot_reload.py"]

  # --- Scheduler: cron jobs (APScheduler) ---
  scheduler:
    image: ai-company/agent:0.1.0
    build:
      context: .
      dockerfile: framework/docker/agent.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ai_company}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_company}
      BROKER_URL: http://web:8090
      BROKER_TOKEN: ${SCHEDULER_TOKEN}
      LOG_LEVEL: INFO
      BACKUP_DIR: /workspace/backups
      BACKUP_RETAIN: "30"
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ${COMPANY_DIR:-./instance/company}:/workspace/company:ro
      - ${AGENTS_DIR:-./instance/agents}:/workspace/agents:ro
      - ./docker-compose.override.yml:/workspace/docker-compose.override.yml:ro
      - ${BACKUPS_DIR:-./instance/backups}:/workspace/backups
    command: ["python3", "-m", "orchestrator.scheduler"]
    working_dir: /app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8811/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- TTS: Piper (CPU). Source: external/ai-tts submodule ---
  # The image has its own HEALTHCHECK (unhealthy unless the default voice is
  # installed), so none is declared here.
  tts:
    build:
      context: ./external/ai-tts
      dockerfile: Dockerfile
    image: ai-company/tts:latest
    restart: unless-stopped
    environment:
      DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-pt_BR-faber-medium}
      PRELOAD_VOICE: ${TTS_PRELOAD_VOICE:-1}
      TZ: ${TZ:-America/Sao_Paulo}

  # --- Transcriber: faster-whisper. Source: external/ai-transcriber submodule ---
  # GPU is opt-in: layer docker-compose.gpu.yml on top
  # (`COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml`) to add the
  # NVIDIA reservation and switch WHISPER_DEVICE/COMPUTE_TYPE to cuda/float16.
  # The defaults run on CPU/int8 so any host works (Mac, devcontainer, CI
  # without a GPU); the small model also avoids loading 6GB on a CPU.
  # The image has its own HEALTHCHECK on /health.
  transcriber:
    build:
      context: ./external/ai-transcriber
      dockerfile: Dockerfile
    image: ai-company/transcriber:latest
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-}
      WHISPER_PRELOAD: ${WHISPER_PRELOAD:-0}
      MAX_UPLOAD_MB: ${TRANSCRIBER_MAX_UPLOAD_MB:-50}
      API_KEY: ${TRANSCRIBER_API_KEY:-}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - whisper-cache:/cache
    depends_on:
      whisper-cache-init:
        condition: service_completed_successfully

  # One-shot: the transcriber image runs as uid 1000, but whisper-cache
  # volumes created by older images are owned by root. Hand them over so the
  # model cache stays writable. No-op on fresh volumes.
  whisper-cache-init:
    image: alpine:3.20
    restart: "no"
    command: ["sh", "-c", "[ \"$$(stat -c %u /cache)\" = 1000 ] || chown -R 1000:1000 /cache"]
    volumes:
      - whisper-cache:/cache

  # --- Cloudflared named tunnel (optional, profile `tunnel`) ---
  # Exposes the internal `web:8090` on a public hostname via the Cloudflare
  # edge, with no port-forward / DNS / Let's Encrypt. Automatic HTTPS. D-94.
  #
  # Usage: create a tunnel in the Cloudflare Zero Trust dashboard, copy the
  # token, paste it into `CF_TUNNEL_TOKEN` in .env, and:
  #   docker compose --profile tunnel up -d cloudflared
  # Without the profile the service does not start — an instance that does
  # not want to be public runs as usual.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
      TZ: ${TZ:-America/Sao_Paulo}
    command: ["tunnel", "--no-autoupdate", "run"]

volumes:
  postgres-data:
  whisper-cache:
